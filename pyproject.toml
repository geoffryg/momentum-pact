[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-pact"
version = "0.1.0"
description = "A local-first accountability and executive-functioning scaffold"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
momentum-pact = "momentum_pact.app:main"
momentum-pact-cli = "momentum_pact.cli:main"
momentum-pact-mcp = "momentum_pact.mcp_server:main"
momentum-pact-waybar = "momentum_pact.integrations.waybar:main"

[project.urls]
Homepage = "https://github.com/geoffryg/momentum-pact"
Repository = "https://github.com/geoffryg/momentum-pact"
Issues = "https://github.com/geoffryg/momentum-pact/issues"

[tool.setuptools.packages.find]
include = ["momentum_pact*"]

[tool.setuptools.package-data]
momentum_pact = ["assets/*"]
