[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-pact"
version = "0.1.0"
description = "A local-first accountability and executive-functioning scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
momentum-pact = "momentum_pact.app:main"
momentum-pact-cli = "momentum_pact.cli:main"
momentum-pact-waybar = "momentum_pact.integrations.waybar:main"

[tool.setuptools.packages.find]
include = ["momentum_pact*"]

[tool.setuptools.package-data]
momentum_pact = ["assets/*"]
